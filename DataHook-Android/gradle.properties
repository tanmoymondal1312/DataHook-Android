# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Android Studio 2026.x bundles JBR 25, but Gradle 8.x's embedded Kotlin DSL
# compiler cannot parse Java 25 (it dies with "IllegalArgumentException: 25.0.4"
# while compiling build scripts). Pinning the Gradle *daemon* to a JDK 17–21
# makes builds work identically from the IDE, the CLI and CI, whichever JVM
# launches Gradle.
# MACHINE-SPECIFIC PATH — change it if you build on another machine.
org.gradle.java.home=C\:\\Users\\tanmo\\.jdks\\jbr-21.0.11
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
